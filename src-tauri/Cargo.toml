[package]
name = "spreadmunch-tauri"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "spreadmunch_tauri"
path = "src/lib.rs"

[dependencies]
spreadmunch-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
calamine = "0.26"
rfd = "0.15"

[dev-dependencies]
spreadmunch-core = { path = "../core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "spreadmunch"
path = "src/main.rs"
